name: ci

on:
  push:
    branches:
      - main
      - master
      - "feat/**"
      - "v*.*.*"
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check ucm_accept tests scripts
      - name: Test
        run: pytest -q

  smoke:
    name: virtual acceptance (mock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui]"
      - name: Offline doctor (mock)
        run: ucm-accept --doctor --mock
      - name: Full mock acceptance
        run: |
          ucm-accept --mock --fast --all --outputs /tmp/ucm-smoke
          REPORT="$(find /tmp/ucm-smoke/runs -name report.json -print -quit)"
          python scripts/verify_report.py "$REPORT"
      - name: Export check
        run: |
          ucm-accept --mock --fast --item perf --outputs /tmp/ucm-export --report /tmp/ucm-export/report.html
          test -s /tmp/ucm-export/report.html
      - name: Asset pack smoke (AssetHub)
        run: |
          python scripts/prepare_assets.py --assets-dir /tmp/ucm-assets --init --seed-bundled
          python scripts/prepare_assets.py --assets-dir /tmp/ucm-assets
          UCM_ASSETS_DIR=/tmp/ucm-assets ucm-accept --doctor --mock | grep -q "资产包"
          UCM_ASSETS_DIR=/tmp/ucm-assets ucm-accept --doctor --mock | grep -q "SHA256"
          UCM_ASSETS_DIR=/tmp/ucm-assets ucm-accept --mock --fast --item perf --outputs /tmp/ucm-assets-smoke
          test -s /tmp/ucm-assets-smoke/runs/*/report.html

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: raven-actions/actionlint@v2

  build:
    name: build wheel
    runs-on: ubuntu-latest
    needs: [test, smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist/wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: Install from wheel and smoke
        run: |
          python -m venv /tmp/pkg-venv
          /tmp/pkg-venv/bin/pip install --upgrade pip
          /tmp/pkg-venv/bin/pip install dist/*.whl
          /tmp/pkg-venv/bin/pip check
          /tmp/pkg-venv/bin/ucm-accept --version
          /tmp/pkg-venv/bin/ucm-accept --mock --fast --item perf --outputs /tmp/pkg-smoke
          test -s /tmp/pkg-smoke/runs/*/report.html
      - uses: actions/upload-artifact@v4
        with:
          name: ucm-accept-dist
          path: dist/*

  windows-exe:
    name: windows exe
    runs-on: windows-latest
    needs: [test]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ucm-accept-windows-x64
          path: dist/ucm-accept-windows-x64.zip

  docker:
    name: docker buildx (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        platform: ["linux/amd64", "linux/arm64"]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: false
          build-args: |
            INSTALL_AGENTX=0
