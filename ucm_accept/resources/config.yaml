# =============================================================================
# UCM 推理加速验收工具 · 默认配置
# -----------------------------------------------------------------------------
# 所有预设参数均外置在此文件。交付人员可修改本文件，无需改动代码。
# 支持 ${ENV_VAR} 与 ${ENV_VAR:-默认值} 环境变量展开，便于离线镜像注入。
# 构建离线包时请将 tokenizer / 数据集路径改为镜像内绝对路径。
# =============================================================================
schema_version: 1

app:
  title: UCM 推理加速验收工具
  subtitle: 客户现网 LLM 推理加速效果与服务质检验收
  report_dir: ./outputs
  language: zh_CN
  # 统一资产包（tokenizers / datasets / evalscope-cache）目录；
  # 留空时自动按顺序发现：环境变量 UCM_ASSETS_DIR → 本项 → exe 同级 assets/ →
  # /opt/ucm-accept/assets → 包内置 resources/assets。
  assets_dir: ""
  # 模拟引擎用于交付演示、CI 虚跑与离线自检，不产生真实压测流量。
  mock:
    delay_ms: 180
    profile: nominal        # nominal | degraded

# =============================================================================
# 本次验收执行的测试范围；GUI / CLI 的"执行全部"仅覆盖此处选中的测试项。
# 可选值：perf / multiturn / sla / accuracy / agent
# =============================================================================
run:
  items: [perf, multiturn, sla, accuracy, agent]

endpoint:
  base_url: http://127.0.0.1:8801/v1
  model: Qwen2.5-0.5B-Instruct
  api_key: ""
  timeout_s: 180
  connect_timeout_s: 8
  probe_mode: auto          # auto | models | chat
  verify_ssl: false

defaults:
  context_length: 65536
  concurrency: 8
  requests: 64
  input_length: 65536
  output_length: 512
  hit_rate: 0.9

perf:
  # 并发梯度；默认单点 8 并发，可改为 [4, 8, 16] 等梯度。
  parallel: [8]
  number: 64
  warmup_num: 0
  # 输入长度（min = max，同一值）。
  min_prompt_length: 65536
  max_prompt_length: 65536
  # 输出 tokens（min = max，同一值）。
  min_tokens: 512
  max_tokens: 512
  # 前缀命中：prefix-length = 输入长度 × 命中率（取整）；prefix-count 为前缀种数。
  prefix_count: 32
  tokenizer_path: Qwen/Qwen2.5-0.5B-Instruct
  dataset: random
  request_timeout_s: 21600
  success_threshold: 0.95
  extra_args: []
  env: {}

multiturn:
  scenario: share_gpt_zh
  # 数据集为 EvalScope 内置多轮场景，首次执行从 ModelScope 拉取并缓存（离线可预置）。
  scenarios:
    share_gpt_zh:
      label: 真实对话数据集（中文）
      dataset: share_gpt_zh_multi_turn
      description: ShareGPT 中文真实多轮对话，覆盖日常问答与任务型对话
    share_gpt_en:
      label: 真实对话数据集（英文）
      dataset: share_gpt_en_multi_turn
      description: ShareGPT 英文真实多轮对话，覆盖通用与代码类对话
    swe_smith:
      label: 真实 Agent 代码修复
      dataset: swe_smith
      description: SWE-smith 轨迹现场构建的多轮代码修复任务（live 构建模式）
    trie_agentic_coding:
      label: IDE 代码补全类应用
      dataset: trie_agentic_coding
      description: trie 采集的编码 Agent 真实轨迹回放（约 8K 上下文，ignore_eos 定长回放）
    trie_code_qa:
      label: 代码问答 agent
      dataset: trie_code_qa
      description: trie 采集的代码问答 Agent 真实轨迹回放（约 8K 上下文）
    trie_office_work:
      label: 办公自动化 agent
      dataset: trie_office_work
      description: trie 采集的办公自动化 Agent 真实轨迹回放（约 8K 上下文）
  parallel: 4
  # 会话组数：--number 语义为共发起多少条多轮会话（每条会话含多轮，轮数由数据集决定）。
  conversations: 12
  min_turns: 2
  max_turns: 5
  min_tokens: 128
  max_tokens: 512
  request_timeout_s: 180
  extra_args: []

sla:
  # SLA 达标判定完全由 EvalScope 原生 --sla-auto-tune 完成（不使用任何自研判定）。
  mode: auto_tune
  # 压测输入口径
  input_length: 65536
  output_tokens: 512
  prefix_ratio: 0.9
  prefix_count: 8
  target:
    concurrency: 256
  # 达标阈值（多档，任填；留空的档位不参与判定）：
  # avg_ttft_s 秒 / avg_tpot_ms 毫秒 / p99_ttft_s 秒 / p99_tpot_ms 毫秒
  thresholds:
    avg_ttft_s: 30
    avg_tpot_ms: 50
    p99_ttft_s: null
    p99_tpot_ms: null
  # 与原命令一一对应，便于客户复现：
  # evalscope perf ... --sla-auto-tune --sla-variable parallel \
  #   --sla-params '[{"avg_ttft":"<= 30s","avg_tpot":"<= 50ms"}]'
  auto_tune:
    lower: 2
    upper: 256
    number: 200
    variable: parallel
    num_runs: 2
    number_multiplier: 2
    extra_args: []

accuracy:
  runs: 2
  # limit 不配置时跑全量；需要抽样时在数据集条目或此处单独设置 limit
  stability_threshold: 0.01
  request_timeout_s: 14400
  # 每项精度测试独立执行；默认四类数据集各跑两遍，用于验证 KVCache 落盘一致性。
# enabled: false 可临时剔除某项数据集（例如现场时间不足时只跑数学 + 工具调用）。
  datasets:
    gpqa:
      label: 基础问答
      dataset: gpqa_diamond
      subset: ""
      enabled: true
      description: GPQA Diamond，研究生级问答，衡量基础知识与推理
    gsm8k:
      label: 数学推理
      dataset: gsm8k
      subset: ""
      enabled: true
      description: GSM8K，小学数学应用题，衡量多步推理
    longbench_v2:
      label: 长文本
      dataset: longbench_v2
      subset: short
      enabled: true
      description: LongBench-v2 short 子集，衡量长上下文理解
    bfcl_v3:
      label: 工具调用
      dataset: bfcl_v3
      subset: ""
      enabled: true
      description: BFCL-v3，函数调用与工具选择能力；需被测服务启用工具调用（vLLM 示例：--enable-auto-tool-choice --tool-call-parser hermes）
  extra_args: []

agent:
  dataset_name: AgentX-claudecode
  # EvalScope AgentX 默认 256K 上下文工作负载；低于该值只能降级为 smoke，指标不可比。
  context_required: 262144
  # 0 表示自动探测 /v1/models 的 max_model_len；探测不到时按 required 处理并提示。
  context_detected: 0
  parallel: 4
  # EvalScope AgentX benchmark 模式要求 duration >= 900 秒。
  duration_s: 900
  success_threshold: 0.95
  scenario_name: agentx
  degraded:
    mode: smoke
    parallel: 1
  extra_args: []

evalscope:
  executable: evalscope
  # p90_ttft / p90_tpot 原生 SLA 参数要求 EvalScope >= 1.15。
  min_version: "1.15.0"
  outputs_dir: ./outputs/evalscope
  env:
    EVALSCOPE_LANGUAGE: zh
  # 留空使用内置参数构造器；如需适配客户 EvalScope 版本，可按 argv 列表覆写。
  perf_command: []
  accuracy_command: []
  multiturn_command: []
  agent_command: []

report:
  title: UCM 推理加速产品验收报告
  company: ""
  operator: ""
  footer: 本报告由 UCM 推理加速验收工具生成，原始数据可在输出目录中复核。
  pdf:
    enabled: true
